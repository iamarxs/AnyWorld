[project]
name = "artificial-dungeon"
version = "0.1.0"
description = "An asynchronous, WebSocket-based multiplayer text RPG orchestrated by an LLM."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",
    "pyyaml>=6.0.1",
    "openai>=1.10.0",
    "jinja2>=3.1.3",
]

[project.optional-dependencies]
dev = [
    "black>=24.0",
    "flake8>=7.0",
    "httpx>=0.27",
    "pytest>=8.0",
]

[project.scripts]
artificial-dungeon = "app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "core", "logic"]

[tool.hatch.build.targets.wheel.force-include]
"app.py" = "app.py"
"config.yaml" = "config.yaml"
"templates" = "templates"
"static" = "static"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
